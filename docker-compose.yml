services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tikrip_db
      - POSTGRES_USER=tikrip_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tikrip_user -d tikrip_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: gunicorn core.asgi:application --bind 0.0.0.0:8000 -k uvicorn.workers.UvicornWorker --workers 3
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:

      - DATABASE_URL=postgres://tikrip_user:${POSTGRES_PASSWORD}@db:5432/tikrip_db

  bot:
    build: .
    command: python manage.py runbot
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    env_file: .env
    environment:
      - DATABASE_URL=postgres://tikrip_user:${POSTGRES_PASSWORD}@db:5432/tikrip_db
    restart: always

volumes:
  postgres_data: